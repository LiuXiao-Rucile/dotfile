# =====================================================
# tmux 配置
# =====================================================

# --- 基础设置 ---
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# 修改 prefix 键为 Ctrl-a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# 窗口/面板下标从 1 开始
set -g base-index 1
setw -g pane-base-index 1

# 终端历史行数（增大）
set -g history-limit 50000

# 减少 ESC 延迟
set -sg escape-time 10

# 状态栏刷新间隔
set -g status-interval 5

# --- 鼠标支持 ---
set -g mouse on

# --- 复制模式（vi 风格）---
setw -g mode-keys vi

# 进入复制模式
bind v copy-mode

# 复制选中内容后 不退出 copy-mode
# （默认 MouseDragEnd1Pane 会退出，这里改为只复制不退出）
bind -T copy-mode-vi y send-keys -X copy-selection
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection

# 取消 Enter 退出 copy-mode（改为仅复制）
bind -T copy-mode-vi Enter send-keys -X copy-selection

# --- 面板分割快捷键 ---
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# 面板切换（vim 方向键）
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# 重新加载配置
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# --- 状态栏样式 ---
set -g status-position bottom
set -g status-bg colour234
set -g status-fg colour137
set -g status-left ''
set -g status-right '#[fg=colour233,bg=colour241,bold] %d/%m #[fg=colour233,bg=colour245,bold] %H:%M:%S '
set -g status-right-length 50
set -g status-left-length 20

setw -g window-status-current-format ' #I#[fg=colour250]:#[fg=colour255]#W#[fg=colour50]#F '
setw -g window-status-format ' #I#[fg=colour237]:#[fg=colour250]#W#[fg=colour244]#F '

# --- 插件（tpm）---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# tmux-better-mouse-mode：更强的鼠标滚动支持
set -g @plugin 'NHDaly/tmux-better-mouse-mode'

# 滚动时每次滚动的行数
set -g @scroll-speed-num-lines-per-scroll 5

# 在非激活面板上也可以用鼠标滚动
set -g @scroll-without-changing-pane on

# 鼠标滚动到底部时自动退出 copy-mode，回到正常模式
set -g @scroll-down-exit-copy-mode on

# 在 shell 命令行（未进入 alternate screen）时也启用滚动
set -g @emulate-scroll-for-no-mouse-alternate-buffer on

# 初始化 tpm（必须放在最后）
run '~/.tmux/plugins/tpm/tpm'
